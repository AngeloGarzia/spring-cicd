name: Configuration Java

on:
  workflow_dispatch:

jobs:

  affichage:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Afficher la version de Java
        run: java -version

      - name: Afficher la version de Maven
        run: mvn -version