name: Workflow CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-and-codeql:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven et JaCoCo
        run: mvn -B clean verify -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true

      - name: Générer le rapport Checkstyle
        run: mvn site

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Publier le rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: target/site/jacoco

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v4
        with:
          name: rapport-checkstyle
          path: target/site/

      - name: Publier le rapport SpotBugs
        uses: actions/upload-artifact@v4
        with:
          name: rapport-spotbugs
          path: target/spotbugs